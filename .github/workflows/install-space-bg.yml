name: Install fixed global background

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-space-bg.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild WebP asset
        run: |
          cat tools/bg-chunks/part1.txt tools/bg-chunks/part2.txt tools/bg-chunks/part3.txt | base64 -d > assets/site-space-bg.webp
          test "$(wc -c < assets/site-space-bg.webp)" -gt 20000

      - name: Fix global background CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("style.css")
          s=p.read_text()
          old='html{scroll-behavior:smooth}body{margin:0;background-color:#020712;background-image:linear-gradient(rgba(2,7,18,.18),rgba(3,16,26,.28)),url("assets/site-space-bg.webp");background-size:cover;background-position:center top;background-repeat:no-repeat;background-attachment:fixed;color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh}'
          new='html{scroll-behavior:smooth;background-color:#020712;background-image:linear-gradient(rgba(2,7,18,.24),rgba(3,16,26,.30)),url("assets/site-space-bg.webp");background-size:cover;background-position:center center;background-repeat:no-repeat;background-attachment:fixed}body{margin:0;background:transparent;color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh}'
          if old not in s:
              raise SystemExit("Expected background CSS not found")
          s=s.replace(old,new)
          s=s.replace('@media(max-width:700px){body{background-attachment:scroll;background-position:center top}}','@media(max-width:700px){html{background-attachment:scroll;background-position:center top}}')
          p.write_text(s)
          PY

      - name: Clean temporary installer files
        run: |
          git rm tools/bg-chunks/part1.txt tools/bg-chunks/part2.txt tools/bg-chunks/part3.txt
          git rm .github/workflows/install-space-bg.yml

      - name: Commit fixed asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-space-bg.webp style.css
          git commit -m "Install fixed global space background"
          git push
